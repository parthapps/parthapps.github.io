<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Library Map — Self Study Library &amp; Seat Management</title>
  <meta name="description" content="Study Library seat map, student admissions, fees passbook, and WhatsApp reminders.">
  <!-- Compiled Tailwind CSS (same classes as before, no CDN needed) -->
  <link rel="stylesheet" href="css/app.css">
  <!-- Google Fonts (cached by the service worker after the first online visit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      overscroll-behavior: none;            /* no browser pull-to-refresh / bounce: feels like an app */
      touch-action: pan-x pan-y;            /* no pinch-zoom / double-tap zoom */
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea { user-select: text; -webkit-user-select: text; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      body > *:not(#printable-passbook) { display: none !important; }
      #printable-passbook, #printable-passbook.hidden { display: block !important; }
    }
  </style>

  <meta name="theme-color" content="#047857">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body class="bg-slate-100 text-slate-900 antialiased min-h-screen">

  <!-- Main Mobile App Shell -->
  <div class="max-w-md mx-auto bg-slate-50 min-h-screen shadow-2xl flex flex-col relative pb-20">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-sm hidden transition-all">
      <div class="bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 border border-slate-700">
        <span class="text-emerald-400 font-bold text-base">✓</span>
        <p id="toast-text" class="text-xs font-bold leading-tight"></p>
      </div>
    </div>

    <!-- App Header (Dynamic Owner Name, Branch Selector) -->
    <header class="sticky top-0 z-30 bg-slate-50/95 backdrop-blur-md px-4 pt-3 pb-2.5 border-b border-slate-200">
      <div class="flex items-center justify-between">
        <div>
          <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider" id="header-greeting">Welcome</span>
          <h1 class="text-xl font-black text-slate-900 leading-tight" id="header-owner-name">Library Owner</h1>
          <p class="text-[11px] font-semibold text-emerald-700" id="header-library-name">Study Library</p>
        </div>
        <div class="flex items-center gap-2">
          <!-- Branch Switcher -->
          <select id="branch-select" onchange="switchBranch(this.value)" class="text-xs font-bold text-slate-800 bg-white px-3 py-1.5 rounded-xl border border-slate-300 shadow-xs focus:outline-none">
          </select>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Views Container -->
    <main id="app-content" class="flex-1 px-4 pt-3 space-y-4">
      <!-- Views injected: Home (with Analytics), Students, Seats (Interactive Room Canvas), Payments (Passbook), Settings -->
    </main>

    <!-- Bottom Navigation Bar (5 Tabs) -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 px-2 py-1 shadow-lg">

          <span class="text-[10px]">Home</span>
        </button>

        <!-- Students -->
        <button onclick="navigateTab('students')" id="nav-students" class="nav-btn py-1.5 flex flex-col items-center text-slate-500 font-medium">

        <button onclick="navigateTab('settings')" id="nav-settings" class="nav-btn py-1.5 flex flex-col items-center text-slate-500 font-medium">
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span class="text-[10px]">Settings</span>

    <!-- Modals Container -->
    <div id="modal-container"></div>
  </div>

  <!-- Hidden Print Container (passbook / receipt) -->
  <div id="printable-passbook" class="hidden p-6 bg-white"></div>

  <!-- Complete Javascript Application Engine -->
  <script>
    const STORAGE_KEY = 'library_map_data_v2';
    // Broadcast notice file. Only the admin (you) edits notice.json on GitHub; owners cannot edit it.
    const NOTICE_URL = 'notice.json';
    const NOTICE_SEEN_KEY = 'library_map_notice_seen';
    const APP_VERSION = '1.0.0';
    const SUPPORT_EMAIL = 'apps.mishraji@gmail.com';

    let currentTab = 'home';
    let seatShiftFilter = 'all';
    let isMapEditMode = false; // Map Edit vs Locked Map
    let activeDragSeat = null;
    let dragStartPos = null;
    let didMoveDrag = false;
    let paymentSortOrder = 'latest';
    let currentNoticeId = '';
    let lastReceipt = null;
    let lastCollect = { id: null, t: 0 };
    let storageWarned = false;
    let exitArmed = false;

    // ==========================================
    // Small helpers
    // ==========================================
    // Escape any user-entered text before it goes into HTML (prevents code injection)
    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Keep ids safe to use inside onclick="...('id')" handlers
    function cleanId(v, fallback) {
      const s = String(v == null ? '' : v).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 60);
      return s || fallback;
    }

    function pad2(n) { return String(n).padStart(2, '0'); }
    function isDateStr(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
    function money(n) { return Number(n || 0).toLocaleString('en-IN'); }

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    // +1 month. Never overflows into the next month (31 Jan -> 28 Feb) and keeps the original day (anchorDay) for later months.
    function addOneMonth(dateStr, anchorDay) {
      if (!isDateStr(dateStr)) dateStr = getTodayString();
      const [y, m, d] = dateStr.split('-').map(Number);
      const day = anchorDay > 0 ? anchorDay : d;
      const lastDay = new Date(y, m + 1, 0).getDate(); // last day of the NEXT month (m is 1-based)
      const dt = new Date(y, m, Math.min(day, lastDay));
      return `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`;
    }

    function getDaysRemaining(dueDateStr) {
      if (!isDateStr(dueDateStr)) return 0;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const [y, m, d] = dueDateStr.split('-').map(Number);
      const due = new Date(y, m - 1, d); due.setHours(0, 0, 0, 0);
      return Math.round((due.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
    }

    function getStudentStatus(student) {
      const days = getDaysRemaining(student.nextDueDate);
      if (days < 0) return 'overdue';
      if (days <= 3) return 'due_soon';
      return 'paid';
    }

    // 10-digit Indian mobile number or null (accepts +91, 91, 0 prefixes and spaces)
    function normalizePhone(p) {
      let d = String(p || '').replace(/\D/g, '');
      if (d.length === 12 && d.startsWith('91')) d = d.slice(2);
      else if (d.length === 11 && d.startsWith('0')) d = d.slice(1);
      return d.length === 10 ? d : null;
    }

    // Number format for wa.me links
    function waPhone(p) {
      const n = normalizePhone(p);
      if (n) return '91' + n;
      return String(p || '').replace(/\D/g, '');
    }

    function waLink(phone, msg) {
      const ph = waPhone(phone);
      return `https://wa.me/${ph}?text=${encodeURIComponent(msg)}`;
    }

    const DEFAULT_SHIFTS = [
      { id: 'full_day', name: 'Full Day (24 Hr)', startTime: '06:00 AM', endTime: '06:00 AM', defaultFee: 1200 },
      { id: 'morning', name: 'Morning Shift', startTime: '06:00 AM', endTime: '02:00 PM', defaultFee: 800 },
      { id: 'afternoon', name: 'Afternoon Shift', startTime: '02:00 PM', endTime: '06:00 PM', defaultFee: 600 },
      { id: 'evening', name: 'Evening Shift', startTime: '06:00 PM', endTime: '11:00 PM', defaultFee: 750 },
      { id: 'night', name: 'Night Shift', startTime: '11:00 PM', endTime: '06:00 AM', defaultFee: 900 }
    ];

    function shiftKnown(shiftId) {
      return (state.shifts || []).some(s => s.id === shiftId);
    }

    function getShiftDisplayText(shiftId) {
      const found = (state.shifts || []).find(s => s.id === shiftId);
      if (!found) return '(Deleted shift)';
      return `${found.name} (${found.startTime} - ${found.endTime})`;
    }

    function getShiftShortText(shiftId) {
      const found = (state.shifts || []).find(s => s.id === shiftId);
      if (!found) return '(Deleted shift)';
      return found.name;
    }

    // ==========================================
    // Shared constants: app promo + library facilities
    // ==========================================
    const APP_SHARE_URL = 'https://parthapps.github.io/';
    const APP_PROMO = `📲 Library Map — लाइब्रेरी मैनेजमेंट का फ्री ऐप: ${APP_SHARE_URL}`;

    const FACILITIES = [
      { id: 'ac', label: 'Air Conditioned (AC) Study Hall' },
      { id: 'cooler', label: 'Cooler / Fan Cooled Hall' },
      { id: 'wifi', label: 'High-Speed WiFi' },
      { id: 'water', label: 'RO Cold Water' },
      { id: 'power', label: 'Power Socket at every desk' },
      { id: 'chair', label: 'Comfortable Study Chairs' },
      { id: 'cctv', label: '24x7 CCTV Security' },
      { id: 'wash', label: 'Clean Washrooms' },
      { id: 'locker', label: 'Personal Lockers' },
      { id: 'parking', label: 'Parking Space' },
      { id: 'silent', label: 'Peaceful Silent Environment' },
      { id: 'open24', label: 'Open Long Hours / 24x7' },
      { id: 'tea', label: 'Tea / Coffee Available' },
      { id: 'books', label: 'Newspapers & Reference Books' }
    ];

    // Ticked facilities + the owner's own typed ones (comma or new-line separated)
    function getFacilitiesList() {
      const p = state.profile || {};
      const ticked = FACILITIES.filter(f => (p.facilities || []).includes(f.id)).map(f => f.label);
      const extra = String(p.facilitiesExtra || '').split(/[,\n]+/).map(t => t.trim().slice(0, 40)).filter(Boolean);
      return [...ticked, ...extra].slice(0, 20);
    }

    // ==========================================
    // Seats data
    // ==========================================
    const DOT_SIZE = 44, ROW_PITCH = 54, CANVAS_MIN = 470;

    // Tidy grid of 6 desks per row. Small rooms keep the classic spacing; big rooms
    // get a taller canvas so no desk ever sits on top of another.
    function gridLayout(total) {
      const rows = Math.max(1, Math.ceil(total / 6));
      let H = CANVAS_MIN;
      const pts = [];
      if (rows <= 7) {
        const step = rows > 1 ? Math.min(19, 70 / (rows - 1)) : 0;
        for (let i = 0; i < total; i++) {
          pts.push({ x: Math.round(12 + (i % 6) * 15.5), y: Math.round(18 + Math.floor(i / 6) * step) });
        }
      } else {
        H = Math.max(CANVAS_MIN, 70 + (rows - 1) * ROW_PITCH + 70);
        for (let i = 0; i < total; i++) {
          pts.push({ x: Math.round(12 + (i % 6) * 15.5), y: Math.round((70 + Math.floor(i / 6) * ROW_PITCH) / H * 1000) / 10 });
        }
      }
      return { H, pts };
    }

    function generateSeats(branchId, total) {
      const lay = gridLayout(total);
      const list = [];
      for (let i = 1; i <= total; i++) {
        list.push({
          id: `seat_${branchId}_${i}`,
          branchId,
          seatNumber: i,
          label: `S-${i < 10 ? '0' + i : i}`,
          x: lay.pts[i - 1].x,
          y: lay.pts[i - 1].y,
          isAisle: false
        });
      }
      list.canvasH = lay.H;
      return list;
    }

    function getCanvasH(branch) {
      return Math.max(CANVAS_MIN, Math.round(Number((branch || {}).canvasH)) || CANVAS_MIN);
    }

    // Change canvas height but keep every desk at the same pixel position
    function setCanvasH(branch, newH) {
      const oldH = getCanvasH(branch);
      newH = Math.min(8000, Math.max(CANVAS_MIN, Math.round(newH)));
      if (newH === oldH) return;
      state.seats.forEach(sd => {
        if (sd.branchId === branch.id && typeof sd.y === 'number') sd.y = Math.round(sd.y * oldH / newH * 10) / 10;
      });
      branch.canvasH = newH;
    }

    // Seats of a branch. Auto-generated only once per branch (so "Clear All" really stays cleared).
    function getBranchSeats(branchId) {
      if (!state.seats) state.seats = [];
      const branch = state.branches.find(b => b.id === branchId) || state.branches[0];
      let list = state.seats.filter(s => s.branchId === branchId);
      if (!list.length && !branch.seatsInit) {
        list = generateSeats(branchId, branch.totalSeats || 24);
        branch.canvasH = list.canvasH;
        state.seats = [...state.seats, ...list];
        branch.seatsInit = true;
        saveData();
      } else if (!branch.seatsInit) {
        branch.seatsInit = true;
      }
      if (list.some(s => typeof s.x !== 'number' || typeof s.y !== 'number')) {
        const lay = gridLayout(list.length);
        if (lay.H > getCanvasH(branch)) branch.canvasH = lay.H;
        list.forEach((s, i) => {
          if (typeof s.x !== 'number' || typeof s.y !== 'number') {
            s.x = lay.pts[i].x;
            s.y = Math.round(lay.pts[i].y * lay.H / getCanvasH(branch) * 10) / 10;
          }
        });
      }
      return list;
    }

    // Real label written on the desk (e.g. A12) for a seat number
    function lab(branchId, n) {
      const s = (state.seats || []).find(x => x.branchId === branchId && x.seatNumber === n);
      return (s && s.label) || 'S-' + n;
    }

    function uniqueLabel(list, base) {
      let label = base, k = 2;
      const taken = () => list.some(s => (s.label || '').toLowerCase() === label.toLowerCase());
      while (taken()) { label = `${base}-${k++}`; }
      return label;
    }

    function activeStudents(branchId) {
      return state.students.filter(s => s.branchId === branchId && s.status === 'active');
    }

    function occupiedCount(branchId, seats) {
      const set = new Set(activeStudents(branchId).map(s => s.seatNumber));
      return seats.filter(x => set.has(x.seatNumber)).length;
    }

    // Students sitting on a seat (respects the shift filter on the Seat Map)
    function studentsOnSeat(branchId, seatNumber) {
      return state.students.filter(s =>
        s.branchId === branchId && s.status === 'active' && s.seatNumber === seatNumber &&
        (seatShiftFilter === 'all' || s.shift === seatShiftFilter || s.shift === 'full_day'));
    }

    // ==========================================
    // Data: initial state, clean-up and storage
    // ==========================================
    function getInitialData() {
      const branchId = 'branch_1';
      return {
        profile: {
          name: 'Library Owner',
          phone: '',
          email: '',
          libraryName: 'Self Study Library',
          address: '',
          upiId: '',
          facilities: [],
          facilitiesExtra: ''
        },
        branches: [
          { id: branchId, name: 'Main Branch', totalSeats: 24, gridCols: 6, seatsInit: true, canvasH: 470 }
        ],
        activeBranchId: branchId,
        shifts: DEFAULT_SHIFTS.map(s => ({ ...s })),
        seats: generateSeats(branchId, 24),
        students: [],
        payments: []
      };
    }

    // Makes any data (old versions, restored backups) safe and complete
    function normalizeState(d) {
      if (!d || typeof d !== 'object') d = getInitialData();
      const today = getTodayString();
      const rnd = () => Math.random().toString(36).slice(2, 7);

      const p = d.profile && typeof d.profile === 'object' ? d.profile : {};
      const profile = {
        name: String(p.name || 'Library Owner').slice(0, 80),
        phone: String(p.phone || '').slice(0, 20),
        email: String(p.email || '').slice(0, 80),
        libraryName: String(p.libraryName || 'Self Study Library').slice(0, 80),
        address: String(p.address || '').slice(0, 160),
        upiId: String(p.upiId || '').slice(0, 60),
        facilities: (Array.isArray(p.facilities) ? p.facilities : []).filter(id => FACILITIES.some(f => f.id === id)),
        facilitiesExtra: String(p.facilitiesExtra || '').slice(0, 300)
      };

      const branchIds = new Set();
      let branches = (Array.isArray(d.branches) ? d.branches : [])
        .filter(b => b && typeof b === 'object')
        .map((b, i) => {
          let id = cleanId(b.id, 'branch_' + (i + 1));
          while (branchIds.has(id)) id = id + '_' + rnd();
          branchIds.add(id);
          return {
            id,
            name: String(b.name || 'Branch ' + (i + 1)).slice(0, 60),
            totalSeats: Math.max(0, parseInt(b.totalSeats, 10) || 0),
            gridCols: 6,
            seatsInit: !!b.seatsInit,
            canvasH: Math.min(8000, Math.max(CANVAS_MIN, Math.round(Number(b.canvasH)) || CANVAS_MIN))
          };
        });
      if (!branches.length) {
        branches = [{ id: 'branch_1', name: 'Main Branch', totalSeats: 24, gridCols: 6, seatsInit: false }];
        branchIds.add('branch_1');
      }

      const shiftIds = new Set();
      let shifts = (Array.isArray(d.shifts) && d.shifts.length ? d.shifts : DEFAULT_SHIFTS)
        .filter(s => s && typeof s === 'object')
        .map((s, i) => {
          let id = cleanId(s.id, 'shift_' + i);
          while (shiftIds.has(id)) id = id + '_' + rnd();
          shiftIds.add(id);
          const fee = Number(s.defaultFee);
          return {
            id,
            name: String(s.name || 'Shift').slice(0, 40),
            startTime: String(s.startTime || '').slice(0, 12),
            endTime: String(s.endTime || '').slice(0, 12),
            defaultFee: isFinite(fee) && fee >= 0 ? Math.round(fee) : 800
          };
        });
      if (!shifts.length) shifts = DEFAULT_SHIFTS.map(s => ({ ...s }));

      const seatKeys = new Set();
      const seats = (Array.isArray(d.seats) ? d.seats : [])
        .filter(s => s && typeof s === 'object')
        .map(s => {
          const bid = cleanId(s.branchId, '');
          const n = parseInt(s.seatNumber, 10);
          const out = {
            id: cleanId(s.id, `seat_${bid}_${n}`),
            branchId: bid,
            seatNumber: n,
            label: String(s.label || 'S-' + n).slice(0, 20),
            isAisle: false
          };
          if (isFinite(Number(s.x)) && isFinite(Number(s.y)) && s.x !== null && s.y !== null) {
            out.x = Number(s.x); out.y = Number(s.y);
          }
          return out;
        })
        .filter(s => branchIds.has(s.branchId) && isFinite(s.seatNumber))
        .filter(s => {
          const k = s.branchId + '#' + s.seatNumber;
          if (seatKeys.has(k)) return false;
          seatKeys.add(k);
          return true;
        });

      const studentIds = new Set();
      const students = (Array.isArray(d.students) ? d.students : [])
        .filter(s => s && typeof s === 'object')
        .map((s, i) => {
          let id = cleanId(s.id, 's_' + i + '_' + rnd());
          while (studentIds.has(id)) id = id + '_' + rnd();
          studentIds.add(id);
          const bid = cleanId(s.branchId, '');
          const due = isDateStr(s.nextDueDate) ? s.nextDueDate : today;
          const anchor = parseInt(s.anchorDay, 10);
          const fee = Number(s.monthlyFee);
          const out = {
            id,
            branchId: branchIds.has(bid) ? bid : branches[0].id,
            seatNumber: parseInt(s.seatNumber, 10),
            name: String(s.name || 'Student').slice(0, 80),
            phone: String(s.phone || '').replace(/\D/g, '').slice(0, 15),
            shift: cleanId(s.shift, 'full_day'),
            monthlyFee: isFinite(fee) && fee >= 0 ? Math.round(fee) : 0,
            admissionDate: isDateStr(s.admissionDate) ? s.admissionDate : today,
            nextDueDate: due,
            anchorDay: anchor >= 1 && anchor <= 31 ? anchor : parseInt(due.slice(8, 10), 10),
            status: s.status === 'inactive' ? 'inactive' : 'active'
          };
          if (isDateStr(s.lastPaymentDate)) out.lastPaymentDate = s.lastPaymentDate;
          if (isDateStr(s.vacatedDate)) out.vacatedDate = s.vacatedDate;
          return out;
        })
        .filter(s => isFinite(s.seatNumber));

      const payIds = new Set();
      const payments = (Array.isArray(d.payments) ? d.payments : [])
        .filter(p => p && typeof p === 'object')
        .map((p, i) => {
          let id = cleanId(p.id, 'pay_' + i + '_' + rnd());
          while (payIds.has(id)) id = id + '_' + rnd();
          payIds.add(id);
          const bid = cleanId(p.branchId, '');
          const amt = Number(p.amount);
          return {
            id,
            invoiceNumber: String(p.invoiceNumber || ('INV-' + (i + 1))).slice(0, 30),
            branchId: branchIds.has(bid) ? bid : branches[0].id,
            studentId: cleanId(p.studentId, ''),
            studentName: String(p.studentName || 'Student').slice(0, 80),
            seatNumber: parseInt(p.seatNumber, 10) || 0,
            shift: cleanId(p.shift, 'full_day'),
            amount: isFinite(amt) ? Math.round(amt) : 0,
            paymentDate: isDateStr(p.paymentDate) ? p.paymentDate : today,
            paymentMode: String(p.paymentMode || 'cash').slice(0, 12)
          };
        });

      const activeId = cleanId(d.activeBranchId, '');
      return {
        profile,
        branches,
        activeBranchId: branchIds.has(activeId) ? activeId : branches[0].id,
        shifts,
        seats,
        students,
        payments
      };
    }

    function loadData() {
      let raw = null;
      try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { /* storage blocked */ }
      if (!raw) return normalizeState(getInitialData());
      try {
        return normalizeState(JSON.parse(raw));
      } catch (e) {
        // Damaged data: keep a copy instead of silently overwriting it
        try { localStorage.setItem(STORAGE_KEY + '_damaged_' + Date.now(), raw); } catch (_) { }
        return normalizeState(getInitialData());
      }
    }

    let state = loadData();

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        if (!storageWarned) {
          storageWarned = true;
          alert('Could not save data on this phone (storage full or blocked). Please download a backup from Settings.');
        }

      updateHeader();
    }

    // STRICT SEAT CONFLICT VALIDATOR (Prevents 2 students on same seat and shift)
    function validateSeatAvailability(branchId, seatNumber, shift, studentIdToIgnore = null) {
      const existing = state.students.filter(s =>
        s.branchId === branchId &&
        s.status === 'active' &&
        s.seatNumber === seatNumber &&
        s.id !== studentIdToIgnore
      );

      if (existing.length === 0) return { available: true };

      const label = lab(branchId, seatNumber);

      // If existing student has Full Day, no other student can occupy this seat
      const hasFullDay = existing.some(s => s.shift === 'full_day');
      if (hasFullDay) {
        const occ = existing.find(s => s.shift === 'full_day');
        return { available: false, message: `${label} is already occupied by ${occ.name} for Full Day.` };
      }

      // If requested shift is Full Day, but seat already has a student in any shift
      if (shift === 'full_day') {
        return { available: false, message: `${label} already has shift students. Full Day is not available.` };
      }

      // If requested shift is already occupied
      const sameShift = existing.find(s => s.shift === shift);
      if (sameShift) {
        return { available: false, message: `${label} is already occupied in ${getShiftShortText(shift)} by ${sameShift.name}.` };
      }

      return { available: true };
    }

    // Unique receipt number (INV-YYYYMM-001, 002 ... never repeats)
    function nextInvoiceNumber() {
      const d = new Date();
      const prefix = `INV-${d.getFullYear()}${pad2(d.getMonth() + 1)}-`;
      let max = 0;
      state.payments.forEach(p => {
        if (typeof p.invoiceNumber === 'string' && p.invoiceNumber.startsWith(prefix)) {
          const n = parseInt(p.invoiceNumber.slice(prefix.length), 10);
          if (n > max) max = n;
        }
      });
      return prefix + String(max + 1).padStart(3, '0');
    }

    // FEES RECEIVED ACTION (+1 Month Extension)
    function collectFee(studentId) {
      const student = state.students.find(s => s.id === studentId);
      if (!student || student.status !== 'active') return;

      // Protect against accidental double taps
      const now = Date.now();
      if (lastCollect.id === studentId && now - lastCollect.t < 2000) return;
      lastCollect = { id: studentId, t: now };

      const today = getTodayString();
      const anchor = student.anchorDay || parseInt(String(student.nextDueDate || today).slice(8, 10), 10);
      const newDueDate = addOneMonth(student.nextDueDate || today, anchor);
      student.lastPaymentDate = today;
      student.nextDueDate = newDueDate;

      const payment = {
        id: `pay_${Date.now()}`,
        invoiceNumber: nextInvoiceNumber(),
        branchId: student.branchId,
        studentId: student.id,
        studentName: student.name,
        seatNumber: student.seatNumber,
        shift: student.shift,
        amount: student.monthlyFee,
        paymentDate: today,
        paymentMode: 'cash'
      };
      state.payments.unshift(payment);
      saveData();

      closeModal();
      showToast(`₹${student.monthlyFee} fee received. Due extended to ${newDueDate}`);
      openReceiptModal(payment, student);
      renderCurrentTab();
    }

      const on = id => { const el = document.getElementById(id); return !!(el && el.checked && !el.disabled); };
      const lib = state.profile.libraryName || 'Self Study Library';

      let msg = on('sh-name') ? `*📚 ${lib}* 📚\n\n` : '';
      if (on('sh-seats')) {
        msg += `🟢 *Seats Update:* ${vacant} Vacant Desks Available Now!\n\n`;

        msg += `✨ *Facilities Provided:*\n${getFacilitiesList().map(f => '• ' + f).join('\n')}\n\n`;

    async function shareText(text) {
      if (navigator.share) {
        try {
          await navigator.share({ text });
          return true;
        } catch (e) {
          if (e && e.name === 'AbortError') return false; // user closed the share sheet

      }
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');

    // Looks random but never repeats within a full cycle: day number x a step that is coprime with the list size
    function getSuvichar(date = new Date()) {
      const n = SUVICHAR_LIST.length;
      const gcd = (a, b) => b ? gcd(b, a % b) : a;
      let step = 7;
      while (gcd(step, n) !== 1) step++;
      const dayNumber = Math.floor(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000);
      return SUVICHAR_LIST[(dayNumber * step + 11) % n];
    }

      text += `\n${APP_PROMO}`;
      shareText(text);
    }

                  onpointerdown="handleDotPointerDown(event, ${seat.seatNumber})"
                >
                  <span class="text-[11px] leading-tight truncate max-w-[38px]">${esc(seat.label || seat.seatNumber)}</span>
                  <span class="text-[8px] font-bold opacity-90 truncate max-w-[38px] leading-none">${statusLabel}</span>

    // POINTER HANDLER FOR SEAT DRAGGING & TAPPING ON CANVAS
    function handleDotPointerDown(e, seatNumber) {
      e.stopPropagation();
      const dot = e.currentTarget;
      dot.setPointerCapture(e.pointerId);

      activeDragSeat = seatNumber;
      dragStartPos = { x: e.clientX, y: e.clientY };
      didMoveDrag = false;

      dot.onpointermove = (m) => {
        if (!isMapEditMode) return;
        if (Math.abs(m.clientX - dragStartPos.x) > 4 || Math.abs(m.clientY - dragStartPos.y) > 4) didMoveDrag = true;
        if (!didMoveDrag) return;

        const canvas = document.getElementById('room-canvas');
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const nx = clampX(((m.clientX - rect.left) / rect.width) * 100);
        const ny = clampY(((m.clientY - rect.top) / rect.height) * 100);
        dot.style.left = nx + '%';
        dot.style.top = ny + '%';

        const s = getBranchSeats(getActiveBranch().id).find(t => t.seatNumber === seatNumber);
        if (s) { s.x = nx; s.y = ny; }
      };

      dot.onpointerup = (u) => {
        try { dot.releasePointerCapture(u.pointerId); } catch (_) { }
        dot.onpointermove = null;
        dot.onpointerup = null;
        window.__dotUp = Date.now();
        const moved = didMoveDrag;
        didMoveDrag = false;
        activeDragSeat = null;
        if (moved) {
          saveData();
        } else if (isMapEditMode) {
          openEditDotModal(seatNumber);
        } else {
          openSeatModal(seatNumber);
        }
      };
    }

    // CANVAS TAP TO ADD SEQUENTIAL DOT AT COORDINATE (1, 2, 3...)
    function handleCanvasTap(e) {
      if (!isMapEditMode) return;
      if (e.target.closest && e.target.closest('[id^="dot-seat-"]')) return;
      if (Date.now() - (window.__dotUp || 0) < 500) return;

      const canvas = document.getElementById('room-canvas');
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      const x = clampX(((e.clientX - rect.left) / rect.width) * 100);
      const y = clampY(((e.clientY - rect.top) / rect.height) * 100);

      const branch = getActiveBranch();
      const list = getBranchSeats(branch.id);
      const n = Math.max(0, ...list.map(s => s.seatNumber)) + 1;
      const label = uniqueLabel(list, `S-${n}`);

      state.seats.push({ id: `seat_${branch.id}_${n}`, branchId: branch.id, seatNumber: n, label, x, y, isAisle: false });
      branch.totalSeats = list.length + 1;
      branch.seatsInit = true;
      saveData();
      showToast(`Desk ${label} placed!`);
      renderCurrentTab();
    }

    // BATCH ADD ROW OF 5 DESKS (new row goes below the lowest desk; the room grows when needed)
    function addBatchDesks(count = 5) {
      const branch = getActiveBranch();
      const list = getBranchSeats(branch.id);
      const start = Math.max(0, ...list.map(s => s.seatNumber)) + 1;
      const H0 = getCanvasH(branch);
      const rowPx = list.length ? Math.max(...list.map(s => s.y * H0 / 100)) + ROW_PITCH : 70;
      if (rowPx + 70 > H0) setCanvasH(branch, rowPx + 70);
      const H = getCanvasH(branch);
      const y = Math.round(rowPx / H * 1000) / 10;

      for (let i = 0; i < count; i++) {
        const n = start + i;
        const label = uniqueLabel(state.seats.filter(s => s.branchId === branch.id), `S-${n}`);
        state.seats.push({ id: `seat_${branch.id}_${n}`, branchId: branch.id, seatNumber: n, label, x: 14 + i * 18, y, isAisle: false });
      }
      branch.totalSeats = list.length + count;
      branch.seatsInit = true;
      saveData();
      showToast(`Added ${count} new desks!`);
      renderCurrentTab();
    }

    // Re-arranges every desk in a tidy grid (6 per row) in seat-number order, room grows to fit
    function autoArrangeDesks() {
      const branch = getActiveBranch();
      const list = getBranchSeats(branch.id).slice().sort((a, b) => a.seatNumber - b.seatNumber);
      if (!list.length) { showToast('No desks to arrange.'); return; }
      if (!confirm('All desks will be placed in neat rows in seat-number order. Continue?')) return;
      const lay = gridLayout(list.length);
      branch.canvasH = lay.H;
      list.forEach((sd, i) => { sd.x = lay.pts[i].x; sd.y = lay.pts[i].y; });
      saveData();
      showToast('Desks arranged!');
      renderCurrentTab();
    }

      const n = activeStudents(branch.id).length;
      const extra = n ? `\n\n${n} active student(s) keep their records and seat numbers; they sit on the same seat again when you recreate that seat number.` : '';

    // Admission & Edit Modal
    function openAdmissionModal(prefilledSeat = null, editStudentId = null) {
      const branch = getActiveBranch();
      const bSeats = [...getBranchSeats(branch.id)].sort((a, b) => a.seatNumber - b.seatNumber);
      const shifts = state.shifts;

      const container = document.getElementById('modal-container');
      const today = getTodayString();
      const nextDue = addOneMonth(today);

      let existing = null;
      if (editStudentId) {
        existing = state.students.find(s => s.id === editStudentId) || null;
      }

      // Which desk is pre-selected: the student's desk, the tapped desk, or the first free desk
      let seatSel = null;
      if (existing) seatSel = existing.seatNumber;
      else if (prefilledSeat !== null && prefilledSeat !== undefined) seatSel = prefilledSeat;

    function handleAdmissionSubmit(e, editStudentId) {
      e.preventDefault();
      const branch = getActiveBranch();
      const seatNum = parseInt(document.getElementById('adm-seat').value, 10);
      const shift = document.getElementById('adm-shift').value;
      const name = document.getElementById('adm-name').value.trim();
      const phone = normalizePhone(document.getElementById('adm-phone').value);
      const fee = Math.round(Number(document.getElementById('adm-fee').value));
      const due = document.getElementById('adm-due').value;

      if (!isFinite(seatNum)) { alert('Please add at least one desk on the Seat Map first.'); return; }
      if (!name) { alert('Please enter the student name.'); return; }
      if (!phone) { alert('Please enter a valid 10-digit mobile number.'); return; }
      if (!isFinite(fee) || fee < 0) { alert('Please enter a valid monthly fee.'); return; }
      if (!isDateStr(due)) { alert('Please choose a valid due date.'); return; }

      // Strict Seat Availability Validation
      const check = validateSeatAvailability(branch.id, seatNum, shift, editStudentId || null);
      if (!check.available) {
        alert(check.message);
        return;
      }

      if (editStudentId) {
        const student = state.students.find(s => s.id === editStudentId);
        if (student) {
          if (student.nextDueDate !== due) student.anchorDay = parseInt(due.slice(8, 10), 10);
          student.seatNumber = seatNum;
          student.shift = shift;
          student.name = name;
          student.phone = phone;
          student.monthlyFee = fee;
          student.nextDueDate = due;
          saveData();
          closeModal();
          showToast(`Student ${name} updated successfully!`);
          renderCurrentTab();
        }
      } else {
        const today = getTodayString();
        const newStudent = {
          id: `s_${Date.now()}`,
          branchId: branch.id,
          seatNumber: seatNum,
          shift,
          name,
          phone,
          monthlyFee: fee,
          admissionDate: today,
          nextDueDate: due,
          anchorDay: parseInt(due.slice(8, 10), 10),
          status: 'active'
        };
        state.students.unshift(newStudent);
        saveData();
        closeModal();
        showToast(`Student ${name} admitted on ${lab(branch.id, seatNum)}!`);
        renderCurrentTab();
      }
    }

    function openNoticeModal(notice, noticeId) {
      currentNoticeId = noticeId;
      const container = document.getElementById('modal-container');
      const message = esc(notice.message || '').replace(/\n/g, '<br>');
      container.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-xs p-4 animate-in fade-in">
          <div class="w-full max-w-sm bg-white rounded-3xl p-6 space-y-4 shadow-2xl text-center border border-slate-100">
            <div class="w-14 h-14 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
              📢
            </div>
            <div class="space-y-1">
              <span class="text-[10px] font-extrabold uppercase tracking-widest text-amber-700 bg-amber-100/70 px-2.5 py-0.5 rounded-full">
                Notice Announcement
              </span>
              <h3 class="text-lg font-black text-slate-900 pt-1">${esc(notice.title)}</h3>
            </div>
            <p class="text-xs text-slate-600 font-medium leading-relaxed bg-slate-50 p-3.5 rounded-2xl border border-slate-100 text-left">
              ${message}
            </p>
            <button onclick="dismissNoticePopup()" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl shadow-md transition-all active:scale-95">
              I Understand &amp; Close
            </button>
          </div>
        </div>
      `;
    }

    function dismissNoticePopup() {
      try { localStorage.setItem(NOTICE_SEEN_KEY, currentNoticeId); } catch (_) { }
      closeModal();
    }

    async function loadRemoteNotice() {
      try {
        const sep = NOTICE_URL.includes('?') ? '&' : '?';
        const r = await fetch(NOTICE_URL + sep + 't=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) return;
        const n = await r.json();
        if (!n || n.enabled !== true || !n.title) return;
        const id = String(n.id || (n.title + '|' + (n.message || '')));
        let seen = '';
        try { seen = localStorage.getItem(NOTICE_SEEN_KEY) || ''; } catch (_) { }
        if (seen === id) return;            // already shown once on this phone
        if (isModalOpen()) return;          // do not interrupt the owner; it will show next time
        openNoticeModal({ title: String(n.title).slice(0, 120), message: String(n.message || '').slice(0, 1200) }, id);
      } catch (e) { /* offline: no notice */ }
    }

    function promptAddBranch() {
      const name = (prompt('Enter new branch name:') || '').trim().slice(0, 60);
      if (!name) return;
      const seatsInput = prompt('Total seats:', '24');
      if (seatsInput === null) return;
      const seats = Math.max(1, Math.min(300, parseInt(seatsInput, 10) || 24));
      const newId = `branch_${Date.now()}`;
      state.branches.push({ id: newId, name, totalSeats: seats, gridCols: 6, seatsInit: false });
      state.activeBranchId = newId;
      saveData();
      renderCurrentTab();
      showToast(`Branch "${name}" created!`);
    }

    // ==========================================
    // About & Help pages (read inside the app)
    // ==========================================
    function openInfoModal(page) {
      const p = (t) => `<p>${t}</p>`;
      const li = (items) => `<ul class="list-disc pl-4 space-y-1">${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
      let title = '';
      let body = '';

      if (page === 'about') {
        title = 'About Library Map';
        body = p('<strong>Library Map</strong> is a free app for study-library owners. Design your real room map, admit students, track monthly fee dues and send WhatsApp reminders and receipts.') +
          li(['Visual seat map with your real desk numbers', 'Shift-wise seats and fees', 'Fee passbook with printable receipts', 'Works offline after the first open', 'Your data stays on your own phone']) +
          p(`Version ${APP_VERSION}<br>Developed by Parth Sharma`);
      } else if (page === 'howto') {
        title = 'How to Use';
        body = li([
          '<strong>Settings:</strong> fill your name, library name, address and mobile number first.',
          '<strong>Seat Map → Shifts:</strong> set your shift timings and default fees.',
          '<strong>Seat Map → Map Edit:</strong> tap empty space to add a desk, drag to move it, tap a desk to give it your real number. Press Lock Map when done.',
          '<strong>Home → Add Student:</strong> choose desk, shift, enter name, mobile and fee.',
          '<strong>Fees Received:</strong> adds one month to the due date and creates a receipt you can send on WhatsApp.',
          '<strong>Colours:</strong> green = paid, yellow = due in 3 days, red = overdue, grey = vacant.',
          '<strong>Backup:</strong> Settings → Download JSON regularly. Use Restore JSON on a new phone.'
        ]);
      } else if (page === 'contact') {
        title = 'Contact Us';
        body = p('Questions, suggestions or a problem in the app? Write to us:') +
          `<a href="mailto:${SUPPORT_EMAIL}?subject=${encodeURIComponent('Library Map support')}" class="block w-full py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl text-center">✉️ ${SUPPORT_EMAIL}</a>` +
          p('When reporting a problem, please tell us your phone model and what you were doing.');
      } else if (page === 'privacy') {
        title = 'Privacy Policy';
        body = li([
          'Everything you enter (library details, students, fees) is stored <strong>only on your phone</strong>.',
          'We do not collect, upload or sell your data. There is no login, no ads and no tracking.',
          'WhatsApp and Call buttons just open WhatsApp or your dialer on your phone. Nothing is sent unless you press send.',
          'Backup files are saved on your phone. Keep them safe.',
          'You are responsible for your students\' personal details. Keep only what you need.',
          'To delete all data, clear the app storage or uninstall the app.'
        ]) +
          `<a href="privacy.html" target="_blank" rel="noopener" class="block w-full py-2.5 bg-slate-100 text-slate-800 font-bold text-xs rounded-xl text-center">Read full Privacy Policy</a>`;
      } else if (page === 'terms') {
        title = 'Terms & Disclaimer';
        body = li([
          'Library Map is a free tool provided "as is", without any warranty.',
          'You are responsible for the accuracy of the data you enter and for taking regular backups.',
          'We are not responsible for lost data, for example if the phone is lost, reset or the app data is cleared.',
          'Fee records and receipts made in the app are for your own record keeping. Check them yourself before relying on them for accounts or tax.',
          'WhatsApp is a separate service by WhatsApp. Its own terms apply to messages you send.'
        ]);
      } else {
        return;
      }

      document.getElementById('modal-container').innerHTML = `
        <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 p-4">
          <div class="w-full max-w-sm bg-white rounded-3xl p-5 space-y-3 max-h-[85vh] overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center border-b pb-2">
              <h3 class="text-base font-black text-slate-900">${esc(title)}</h3>
              <button onclick="closeModal()" class="text-slate-400 font-bold text-lg">✕</button>
            </div>
            <div class="text-xs text-slate-600 font-medium leading-relaxed space-y-3">${body}</div>
            <button onclick="closeModal()" class="w-full py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl">Close</button>
          </div>
        </div>
      `;
    }

    function renameBranch(branchId) {
      const b = state.branches.find(x => x.id === branchId);
      if (!b) return;
      const name = (prompt('Enter new branch name:', b.name) || '').trim().slice(0, 60);
      if (!name || name === b.name) return;
      b.name = name;
      saveData();
      renderCurrentTab();
      showToast(`Branch renamed to "${name}"`);
    }

    function deleteBranch(branchId) {
      const b = state.branches.find(x => x.id === branchId);
      if (!b) return;
      if (state.branches.length <= 1) {
        alert('You need at least one branch. Add another branch first, or use Rename for this one.');
        return;
      }
      if (activeStudents(b.id).length) {
        alert(`"${b.name}" still has active students. Vacate all of them first, then delete the branch.`);
        return;
      }
      if (!confirm(`Delete branch "${b.name}"?\n\nThis also deletes its desks, old student records and fee receipts. Download a backup first if you may need them.`)) return;
      state.branches = state.branches.filter(x => x.id !== b.id);
      state.seats = state.seats.filter(x => x.branchId !== b.id);
      state.students = state.students.filter(x => x.branchId !== b.id);
      state.payments = state.payments.filter(x => x.branchId !== b.id);
      if (state.activeBranchId === b.id) state.activeBranchId = state.branches[0].id;
      saveData();
      renderCurrentTab();
      showToast(`Branch "${b.name}" deleted.`);
    }

    function downloadBackup() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `library_map_backup_${getTodayString()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      showToast('Backup file downloaded');
    }

    function restoreBackup(e) {
      const input = e.target;
      const file = input.files && input.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) {
        alert('Backup file is too large.');
        input.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (!parsed || !Array.isArray(parsed.branches) || !Array.isArray(parsed.students)) throw new Error('bad file');
          if (!confirm('Restoring this backup will replace ALL current data on this phone. Continue?')) return;
          state = normalizeState(parsed);
          saveData();
          renderCurrentTab();
          showToast('Backup restored successfully!');
        } catch (err) {
          alert('Invalid backup file!');
        } finally {
          input.value = '';
        }
      };
      reader.readAsText(file);
    }

    function renderCurrentTab() {
      const app = document.getElementById('app-content');
      if (currentTab === 'home') app.innerHTML = renderHomeView();
      else if (currentTab === 'seats') app.innerHTML = renderSeatsView();
      else if (currentTab === 'students') app.innerHTML = renderStudentsView();
      else if (currentTab === 'payments') app.innerHTML = renderPaymentsView();
      else if (currentTab === 'settings') app.innerHTML = renderSettingsView();
    }

    // Android Back button: closes popups first, then goes to Home, then asks to press again to exit
    function initBackHandling() {
      try {
        history.replaceState({ base: 1 }, '');
        history.pushState({ guard: 1 }, '');
      } catch (e) { return; }
      window.addEventListener('popstate', () => {
        if (isModalOpen()) {
          closeModal();
          history.pushState({ guard: 1 }, '');
        } else if (currentTab !== 'home') {
          navigateTab('home');
          history.pushState({ guard: 1 }, '');
        } else if (!exitArmed) {
          exitArmed = true;
          showToast('Press back again to exit');
          history.pushState({ guard: 1 }, '');
          setTimeout(() => { exitArmed = false; }, 2000);
        } else {
          history.back();
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateHeader();
      renderCurrentTab();
      initBackHandling();
      setTimeout(loadRemoteNotice, 600);
      // Ask the browser not to delete this app's data when the phone is low on storage
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) { }
    });

    // Offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => { });
      });
    }
  </script>
</body>
